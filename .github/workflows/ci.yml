name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax check all scripts
        shell: bash
        run: |
          for f in scripts/*.js tests/*.js; do node --check "$f" || exit 1; done

      - name: Unit tests
        run: npm test

      - name: Verify SKILL.md frontmatter
        shell: bash
        run: |
          head -n 6 SKILL.md | grep -q '^name:' || { echo 'SKILL.md 缺少 name 字段'; exit 1; }
          head -n 6 SKILL.md | grep -q '^description:' || { echo 'SKILL.md 缺少 description 字段'; exit 1; }
