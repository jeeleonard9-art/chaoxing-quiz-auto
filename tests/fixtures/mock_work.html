<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>mock_work — 超星作业页结构合成夹具</title>
<!--
  纯合成夹具：不含任何真实课程、真实题目、真实答案或账号信息。
  仅保留超星作业页的 DOM 结构特征，供离线 DOM 测试使用：
    · 5 道占位题：单选 / 多选 / 判断 / 填空 / 简答 各 1 道
    · 客观题：div.answerBg[qid][qtype] > span[data=字母] + .answer_p
    · 填空题：input[name=tiankongsize<qid>] + textarea[name=answerEditor<qid><j>] + 编辑器 iframe
    · 简答题：textarea[name=answer<qid>] + 一个编辑器 iframe
    · 第 3 题题干故意保留「标签」字样，用于验证"服务端剥离尖括号标签"的提示逻辑
-->
</head>
<body>
<form id="submitForm" action="/mooc-ans/work/addStudentWorkNewWeb?token=REDACTED" method="post">

<!-- 1. 单选题 -->
<div class="questionLi fontLabel singleQuesId" typename="单选题" id="question100000001" data="100000001" tabindex="0" role="option" aria-label="题目 1. ">
  <h3 class="mark_name colorDeep fontLabel workTextWrap">1. <span class="colorShallow">(单选题)</span> 示例单选题：下列哪一项属于正确做法( )</h3>
  <div class="clear"></div>
  <input type="hidden" id="answertype100000001" name="answertype100000001" value="0">
  <input type="hidden" id="answer100000001" name="answer100000001" value="">
  <div class="answerBg workTextWrap" onclick="addChoice(this);" role="radio" aria-label="A 示例选项 A选择" qid="100000001" qtype="0">
    <span data="A" class="choice100000001 num_option fl">A</span>
    <div class="fl answer_p"><p>示例选项 A</p></div>
  </div>
  <div class="answerBg workTextWrap" onclick="addChoice(this);" role="radio" aria-label="B 示例选项 B选择" qid="100000001" qtype="0">
    <span data="B" class="choice100000001 num_option fl">B</span>
    <div class="fl answer_p"><p>示例选项 B</p></div>
  </div>
  <div class="answerBg workTextWrap" onclick="addChoice(this);" role="radio" aria-label="C 示例选项 C选择" qid="100000001" qtype="0">
    <span data="C" class="choice100000001 num_option fl">C</span>
    <div class="fl answer_p"><p>示例选项 C</p></div>
  </div>
  <div class="answerBg workTextWrap" onclick="addChoice(this);" role="radio" aria-label="D 示例选项 D选择" qid="100000001" qtype="0">
    <span data="D" class="choice100000001 num_option fl">D</span>
    <div class="fl answer_p"><p>示例选项 D</p></div>
  </div>
  <div class="clear"></div>
</div>

<!-- 2. 多选题 -->
<div class="questionLi fontLabel singleQuesId" typename="多选题" id="question100000002" data="100000002" tabindex="0" role="option" aria-label="题目 2. ">
  <h3 class="mark_name colorDeep fontLabel workTextWrap">2. <span class="colorShallow">(多选题)</span> 示例多选题：以下哪些属于示例正确选项( )</h3>
  <div class="clear"></div>
  <input type="hidden" id="answertype100000002" name="answertype100000002" value="1">
  <input type="hidden" id="answer100000002" name="answer100000002" value="">
  <div class="answerBg workTextWrap" onclick="addChoice(this);" role="radio" aria-label="A 示例多选 A选择" qid="100000002" qtype="1">
    <span data="A" class="choice100000002 num_option fl">A</span>
    <div class="fl answer_p"><p>示例多选 A</p></div>
  </div>
  <div class="answerBg workTextWrap" onclick="addChoice(this);" role="radio" aria-label="B 示例多选 B选择" qid="100000002" qtype="1">
    <span data="B" class="choice100000002 num_option fl">B</span>
    <div class="fl answer_p"><p>示例多选 B</p></div>
  </div>
  <div class="answerBg workTextWrap" onclick="addChoice(this);" role="radio" aria-label="C 示例多选 C选择" qid="100000002" qtype="1">
    <span data="C" class="choice100000002 num_option fl">C</span>
    <div class="fl answer_p"><p>示例多选 C</p></div>
  </div>
  <div class="clear"></div>
</div>

<!-- 3. 判断题（题干含「标签」字样，用于触发剥离提示） -->
<div class="questionLi fontLabel singleQuesId" typename="判断题" id="question100000003" data="100000003" tabindex="0" role="option" aria-label="题目 3. ">
  <h3 class="mark_name colorDeep fontLabel workTextWrap">3. <span class="colorShallow">(判断题)</span> 示例判断题：题干中的尖括号标签可能被服务端吞掉( )</h3>
  <div class="clear"></div>
  <input type="hidden" id="answertype100000003" name="answertype100000003" value="3">
  <input type="hidden" id="answer100000003" name="answer100000003" value="">
  <div class="answerBg workTextWrap" onclick="addChoice(this);" role="radio" aria-label="A 对选择" qid="100000003" qtype="3">
    <span data="true" class="choice100000003 num_option fl">A</span>
    <div class="fl answer_p"><p>对</p></div>
  </div>
  <div class="answerBg workTextWrap" onclick="addChoice(this);" role="radio" aria-label="B 错选择" qid="100000003" qtype="3">
    <span data="false" class="choice100000003 num_option fl">B</span>
    <div class="fl answer_p"><p>错</p></div>
  </div>
  <div class="clear"></div>
</div>

<!-- 4. 填空题（2 个空位） -->
<div class="questionLi fontLabel singleQuesId" typename="填空题" id="question100000004" data="100000004" tabindex="0" role="option" aria-label="题目 4. ">
  <h3 class="mark_name colorDeep fontLabel workTextWrap">4. <span class="colorShallow">(填空题)</span> 示例填空题：请填写____与____两个空。</h3>
  <div class="clear"></div>
  <input type="hidden" id="answertype100000004" name="answertype100000004" value="2">
  <input type="hidden" name="tiankongsize100000004" value="2">
  <div class="stem_answer">
    <div class="Answer">
      <span class="tiankong fl">第1空</span>
      <div class="divText fl wid750">
        <div class="textDIV">
          <div class=" edui-default">
            <div id="edui101" class="edui-editor edui-default" style="width: 730px;">
              <div id="edui101_iframeholder" class="edui-editor-iframeholder edui-default">
                <iframe id="ueditor_101" width="100%" height="56" frameborder="0" title="示例填空编辑器 1"></iframe>
              </div>
            </div>
          </div>
          <textarea name="answerEditor1000000041" id="answerEditor1000000041" style="display:none;"></textarea>
        </div>
      </div>
      <div class="clear"></div>
    </div>
    <div class="Answer">
      <span class="tiankong fl">第2空</span>
      <div class="divText fl wid750">
        <div class="textDIV">
          <div class=" edui-default">
            <div id="edui102" class="edui-editor edui-default" style="width: 730px;">
              <div id="edui102_iframeholder" class="edui-editor-iframeholder edui-default">
                <iframe id="ueditor_102" width="100%" height="56" frameborder="0" title="示例填空编辑器 2"></iframe>
              </div>
            </div>
          </div>
          <textarea name="answerEditor1000000042" id="answerEditor1000000042" style="display:none;"></textarea>
        </div>
      </div>
      <div class="clear"></div>
    </div>
  </div>
  <div class="clear"></div>
</div>

<!-- 5. 简答题（单个编辑器） -->
<div class="questionLi fontLabel singleQuesId" typename="简答题" id="question100000005" data="100000005" tabindex="0" role="option" aria-label="题目 5. ">
  <h3 class="mark_name colorDeep fontLabel workTextWrap">5. <span class="colorShallow">(简答题)</span> 示例简答题：请简述你的解答过程。</h3>
  <div class="clear"></div>
  <input type="hidden" id="answertype100000005" name="answertype100000005" value="4">
  <input type="hidden" id="answer100000005" name="answer100000005" value="">
  <div class="stem_answer">
    <div class="Answer">
      <div class="divText fl wid750">
        <div class="textDIV">
          <div class=" edui-default">
            <div id="edui103" class="edui-editor edui-default" style="width: 730px;">
              <div id="edui103_iframeholder" class="edui-editor-iframeholder edui-default">
                <iframe id="ueditor_103" width="100%" height="150" frameborder="0" title="示例简答编辑器"></iframe>
              </div>
            </div>
          </div>
          <textarea name="answer100000005" id="answer100000005" style="display:none;"></textarea>
        </div>
      </div>
      <div class="clear"></div>
    </div>
  </div>
  <div class="clear"></div>
</div>

</form>
</body>
</html>
